# test: the WildGuard suite's set (allenai/safety-eval saferlhf), 2,000 responses (1,000 safe, 1,000 harmful) from
# PKU-SafeRLHF v0 test. train: one pair per unique v0 train prompt, both responses (see loaders.load_saferlhf).
name: saferlhf
loader: saferlhf
repo_id: PKU-Alignment/PKU-SafeRLHF
revision: v0
splits: {train: train, test: test}
val_fraction: 0.05              # held out from train by unique prompt, stratified by labels
